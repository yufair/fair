<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大明王朝1566 · 角色人格测试</title>
  <style>
    :root {
      --ink: #2c2c2c; --paper: #f4f1ea; --accent: #7c2d29; --border: #d4cec1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 20px; line-height: 1.8;
      background-image: radial-gradient(#e0dbcf 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .app {
      width: 100%; max-width: 680px; background: #fffdf9;
      border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      padding: 40px; position: relative; overflow: hidden;
    }
    .app::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--accent), #b08d6a); opacity: 0.8;
    }
    /* 首页 */
    .intro { text-align: center; }
    .intro h1 { font-size: 28px; letter-spacing: 4px; margin-bottom: 10px; color: var(--accent); font-weight: normal; }
    .intro p { color: #6e665a; font-size: 15px; margin-bottom: 30px; }
    .start-btn {
      background: var(--accent); color: #fff; border: none; padding: 12px 40px;
      font-size: 16px; border-radius: 4px; cursor: pointer; letter-spacing: 2px;
      font-family: inherit; transition: opacity 0.2s;
    }
    .start-btn:hover { opacity: 0.8; }
    /* 答题 */
    .quiz-header { font-size: 13px; color: #9a8e7e; margin-bottom: 20px; text-align: right; font-family: sans-serif; }
    .q-text { font-size: 18px; font-weight: bold; margin-bottom: 24px; line-height: 1.7; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      text-align: left; background: #fff; border: 1px solid var(--border);
      padding: 16px 20px; border-radius: 4px; font-size: 15px; cursor: pointer;
      font-family: inherit; color: var(--ink); transition: all 0.2s;
    }
    .option:hover { border-color: var(--accent); background: #fdfbf7; transform: translateX(4px); }
    /* 结果 */
    .result { text-align: center; }
    .result .badge { display: inline-block; padding: 4px 12px; border: 1px solid var(--accent); color: var(--accent); font-size: 12px; border-radius: 20px; margin-bottom: 20px; }
    .result .name { font-size: 36px; color: var(--accent); margin-bottom: 8px; letter-spacing: 4px; }
    .result .tags { font-size: 14px; color: #6e665a; margin-bottom: 24px; font-family: sans-serif; }
    .result .tags span { display: inline-block; margin: 0 8px; padding: 2px 8px; background: #eee; border-radius: 4px; }
    .result .rarity { font-size: 14px; color: #8b1a1a; margin-bottom: 24px; background: #fff0f0; display: inline-block; padding: 6px 16px; border-radius: 4px; }
    .result .reason { text-align: left; font-size: 15px; color: #3a342c; line-height: 2; margin-bottom: 20px; padding: 20px; background: #f9f6f0; border-left: 3px solid var(--accent); }
    .result .secondary { font-size: 13px; color: #8a8070; margin-bottom: 30px; }
    .restart-btn { background: none; border: 1px solid var(--border); color: #6e665a; padding: 10px 24px; font-family: inherit; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
    .restart-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>

    options:[
      { text:"“有些事，总要有人去做。”", s:[0,3,1,1,1] },
      { text:"“先活着，再说别的。”", s:[0,1,-1,-1,0] },
      { text:"“对得起自己，比什么都难。”", s:[1,2,0,1,2] },
      { text:"“别太把自己当回事，也别太不把自己当回事。”", s:[2,1,0,2,-2] }
    ]}
];

/* ==========================================
 * 3. 状态与逻辑管理
 * ========================================== */
let userScore = [50, 50, 50, 50, 50]; // 初始五项均为50
let currentQ = 0;

const app = document.getElementById('app');

function renderIntro() {
  app.innerHTML = `
    <div class="intro">
      <h1>大明王朝1566</h1>
      <p>角色人格测试 · OCEAN五维深度解析</p>
      <p style="font-size: 13px; margin-bottom: 40px; color: #9a8e7e;">“在这个朝堂上，没有纯粹的好人，也没有纯粹的坏人，只有不同位置的活法。”</p>
      <button class="start-btn" onclick="startQuiz()">开始测局</button>
    </div>
  `;
}

function startQuiz() {
  userScore = [50, 50, 50, 50, 50];
  currentQ = 0;
  renderQuestion();
}

function renderQuestion() {
  if (currentQ >= questions.length) {
    showResult();
    return;
  }
  const q = questions[currentQ];
  app.innerHTML = `
    <div class="quiz-header">第 ${currentQ + 1} / ${questions.length} 题</div>
    <div class="q-text">${q.text}</div>
    <div class="options">
      ${q.options.map((opt, i) => `<button class="option" onclick="selectOption(${i})">${opt.text}</button>`).join('')}
    </div>
  `;
}

function selectOption(optIndex) {
  const opt = questions[currentQ].options[optIndex];
  // 计分：乘以权重3，让差异更明显
  for(let i = 0; i < 5; i++) {
    userScore[i] += opt.s[i] * 3;
  }
  currentQ++;
  renderQuestion();
}

/* ==========================================
 * 4. 结果计算
 * ========================================== */
function showResult() {
  // 1. 分数收束到 [0, 100]
  const finalScores = userScore.map(v => Math.max(0, Math.min(100, v)));

  // 2. 计算欧氏距离，寻找最匹配角色
  const ranked = characters.map(char => {
    const dist = Math.sqrt(char.coord.reduce((sum, val, idx) => sum + Math.pow(val - finalScores[idx], 2), 0));
    return { ...char, dist };
  }).sort((a, b) => a.dist - b.dist);

  const best = ranked[0];
  const second = ranked[1];

  // 3. 渲染结果页（使用静态预设的稀有度 best.rarity）
  app.innerHTML = `
    <div class="result">
      <div class="badge">匹配度 TOP 1</div>
      <div class="name">${best.emoji} ${best.name}</div>
      <div class="tags">
        <span>${best.mbti}</span>
        <span>${best.zodiac}</span>
      </div>
      
      <div class="rarity">这类人格约占测试人群的 ${best.rarity}%</div>
      
      <div class="reason">
        ${best.reason}
      </div>
      
      <div class="secondary">
        你的副角色是：<b>${second.name}</b>。<br>
        你在这两个角色之间的气质有重叠，但 ${best.name} 的契合度更高。
      </div>
      
      <button class="restart-btn" onclick="renderIntro()">重新测局</button>
    </div>
  `;
}

// 初始化
renderIntro();
</script>
</body>
</html>
