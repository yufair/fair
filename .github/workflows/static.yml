<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你最像大明王朝1566的谁？</title>
  <style>
    :root { --ink: #1a1a1a; --paper: #f5f0e8; --accent: #8b1a1a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif SC", "Songti SC", serif;
      background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .app { width: 100%; max-width: 640px; }
    .card {
      background: #fffdf9; border: 1px solid #d8d0c0; border-radius: 4px;
      padding: 40px 32px; box-shadow: 0 8px 32px rgba(0,0,0,.06);
    }
    h1 { font-size: 24px; letter-spacing: 2px; text-align: center; margin-bottom: 8px; }
    .sub { text-align: center; color: #7a6e5e; font-size: 13px; margin-bottom: 32px; }
    .q-text { font-size: 17px; line-height: 1.8; margin-bottom: 24px; }
    .option {
      display: block; width: 100%; text-align: left;
      background: #fff; border: 1px solid #d8d0c0; border-radius: 3px;
      padding: 14px 18px; margin-bottom: 10px; font-size: 15px; line-height: 1.6;
      cursor: pointer; transition: all .15s; font-family: inherit; color: var(--ink);
    }
    .option:hover { border-color: var(--accent); background: #fdf8f2; }
    .progress { text-align: center; font-size: 12px; color: #9a8e7e; margin-top: 20px; }
    .result h2 { font-size: 22px; color: var(--accent); margin-bottom: 16px; text-align: center; }
    .result .char { font-size: 64px; text-align: center; margin: 8px 0 16px; }
    .result .reason { font-size: 15px; line-height: 2; color: #3a342c; }
    .result .secondary { margin-top: 20px; padding-top: 16px; border-top: 1px dashed #d8d0c0; font-size: 13px; color: #7a6e5e; }
    .restart {
      display: block; margin: 28px auto 0; background: none; border: 1px solid var(--accent);
      color: var(--accent); padding: 10px 32px; border-radius: 3px; font-size: 14px;
      cursor: pointer; font-family: inherit; letter-spacing: 1px;
    }
    .restart:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
<div class="app"><div class="card" id="app"></div></div>

<script>
/* ---------- 维度: 0=道德(原则←→实效) 1=权力(主动←→隐忍) 2=温度(温厚←→冷峻) ---------- */
/* 角色坐标：每维度 0–100，越高越偏：原则/主动/温厚 */
const characters = [
  { name:"嘉靖", emoji:"☯️", coord:[25, 95, 20],
    reason:"你的掌控欲和理性判断在人群中非常突出。你倾向于站在更高处观察局势，用规则和结构来维持秩序，而不是亲自下场冲锋。嘉靖二十年不上朝却能牢牢握住权柄，靠的正是这种‘让别人解决问题，自己把握方向’的能力——你身上有类似的影子。" },
  { name:"海瑞", emoji:"⚖️", coord:[98, 80, 25],
    reason:"你的道德底线极其清晰，而且在关键事情上不太愿意妥协。你相信有些事‘就应该这样’，哪怕代价是让自己变得不讨喜。海瑞抬棺死谏，不是不懂后果，而是他的原则比后果更重——你得分中‘原则’与‘主动’同时偏高，指向的正是这种孤勇型人格。" },
  { name:"吕芳", emoji:"🕊️", coord:[70, 35, 90],
    reason:"你最大的能力不是争，而是‘稳’。你懂得在复杂关系里保全人、也保全自己，愿意用周旋和温度来化解冲突。吕芳服侍嘉靖四十余年，靠的不是权谋碾压，而是远见、忠诚和护佑身边人的胸怀——你的‘温厚’与‘隐忍周旋’得分，和这个角色高度重合。" },
  { name:"严嵩", emoji:"🕸️", coord:[20, 85, 15],
    reason:"你对‘事情实际怎么运转’的敏感度很高，不太被道德口号牵着走。你相信结果和实效，也愿意在灰色地带里布局。严嵩掌控内阁二十年，老谋深算，轻易不出手，出手就是杀招——你得分中‘实效’与‘主动掌控’的组合同样指向这种老辣的现实主义者。" },
  { name:"胡宗宪", emoji:"🏹", coord:[78, 40, 82],
    reason:"你是一个在理想与现实之间走钢丝的人。你有良知和底线，但也清楚事情不是靠硬碰硬就能办成的。胡宗宪夹在严党与清流之间，既要打仗又要保百姓，还要对得起自己的良心——你的‘原则’与‘温厚’都偏高，同时‘隐忍周旋’也不低，正是这种‘公忠体国却左右为难’的类型。" },
  { name:"张居正", emoji:"♟️", coord:[30, 30, 25],
    reason:"你是一个目标感很强、愿意为长期结果忍耐当下的人。你不太在意过程中的‘干净’，更在意事情最终能不能成。张居正心思深重，在权力场里步步为营，甚至愿意牺牲一部分人来换大局——你得分中‘实效’主导、‘温度’偏冷，说明你和这种‘冷静的战略家’有相近的底层逻辑。" },
];

/* ---------- 题目：每题 4 个选项，每个选项加减三维度分 ---------- */
const questions = [
  { text:"你所在的‘衙门’接了一个上面很重视、但底下执行会得罪很多人的差事。你的第一反应是：",
    options:[
      { text:"先把规矩和底线理清楚，该得罪就得罪，事要对得起良心。", s:[+3, +2, +1] },
      { text:"在各方之间找平衡，尽量把事推成，同时把伤害压到最低。", s:[+1, -1, +2] },
      { text:"先判断背后真正的决策者是谁，确保自己位置安全再动。", s:[-2, -1, -2] },
      { text:"不主动出头，跟大流走，别让自己变成靶子。", s:[0, -3, 0] },
    ]},
  { text:"你更认同下面哪句话？",
    options:[
      { text:"有些事，对就是对，错就是错，不能因为难就绕过去。", s:[+3, +2, 0] },
      { text:"事情办成了，才有资格谈对错；办不成，什么都是空的。", s:[-2, +2, -1] },
      { text:"让身边的人不受牵连，比证明自己正确更重要。", s:[+1, -2, +3] },
      { text:"看清局势再动手的人，比急着表态的人走得远。", s:[0, +1, -2] },
    ]},
  { text:"在一次重要的‘廷议’上，你的意见和大多数人不一致。你会：",
    options:[
      { text:"当场说出来，哪怕场面难看，该坚持的必须坚持。", s:[+3, +3, 0] },
      { text:"先记下来，会后找关键人物私下沟通，迂回推进。", s:[+1, -1, +1] },
      { text:"判断一下风向，如果改变不了结果，就不浪费力气。", s:[-1, -1, -1] },
      { text:"把真实想法藏住，顺着大家的意思，但心里有自己的账本。", s:[-1, -2, -2] },
    ]},
  { text:"你更容易被下面哪种人激怒？",
    options:[
      { text:"明明有底线，却为了利益说放弃就放弃的人。", s:[+3, +1, +1] },
      { text:"只会讲大道理，却一件实事也办不成的人。", s:[-2, +2, -2] },
      { text:"为了往上爬，把身边人当垫脚石的人。", s:[+1, +1, +3] },
      { text:"看不清形势、到处乱冲，连累所有人的人。", s:[-1, +1, -2] },
    ]},
  { text:"如果把你放到一个‘说真话会吃亏、不说话又良心不安’的位置上，你大概率会：",
    options:[
      { text:"说。良心不安比吃亏更难受。", s:[+3, +3, +1] },
      { text:"找一个既能说真话、又不至于把自己搭进去的方式。", s:[+2, +1, +1] },
      { text:"先沉默，等一个合适的时机再说。", s:[0, -2, 0] },
      { text:"不说。说了也改变不了什么，先保住自己。", s:[-2, -3, -1] },
    ]},
  // 继续增加到 12–16 题……
];

/* ---------- 计分与匹配 ---------- */
const DIMS = 3;
let userScore = [50, 50, 50]; // 三维度各以 50 为起点
let current = 0;

function render() {
  const app = document.getElementById("app");
  if (current < questions.length) {
    const q = questions[current];
    app.innerHTML = `
      <h1>你最像谁？</h1>
      <p class="sub">《大明王朝1566》角色人格测试</p>
      <p class="q-text">${q.text}</p>
      ${q.options.map((o, i) => `<button class="option" data-i="${i}">${o.text}</button>`).join("")}
      <p class="progress">${current + 1} / ${questions.length}</p>
    `;
    app.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => {
        const opt = q.options[+btn.dataset.i];
        for (let d = 0; d < DIMS; d++) {
          userScore[d] += opt.s[d] * 4; // 每题权重 4，根据题目数量可调
        }
        current++;
        render();
      });
    });
  } else {
    showResult(app);
  }
}

function showResult(app) {
  // 将得分约束在 0–100
  const u = userScore.map(v => Math.max(0, Math.min(100, v)));
  // 计算与每个角色的欧氏距离
  const ranked = characters
    .map(c => ({
      ...c,
      dist: Math.sqrt(c.coord.reduce((sum, v, i) => sum + (v - u[i]) ** 2, 0))
    }))
    .sort((a, b) => a.dist - b.dist);

  const best = ranked[0];
  const second = ranked[1];

  app.innerHTML = `
    <div class="result">
      <p class="sub">你的结果</p>
      <div class="char">${best.emoji}</div>
      <h2>你最像：${best.name}</h2>
      <p class="reason">${best.reason}</p>
      <p class="secondary">副角色：${second.name}　·　你在这两个角色之间的气质有重叠，但 ${best.name} 的匹配度更高。</p>
      <button class="restart" id="restart">重新测一次</button>
    </div>
  `;
  document.getElementById("restart").addEventListener("click", () => {
    userScore = [50, 50, 50];
    current = 0;
    render();
  });
}

render();
</script>
</body>
</html>
